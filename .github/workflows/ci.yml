name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install (non-editable, so mypy sees dpdpkit and dpdpkit.server in one tree)
        run: |
          uv venv
          uv pip install \
            "dpdpkit-policies @ git+https://github.com/dpdpkit-dev/dpdpkit-policies@main" \
            "dpdpkit-core @ git+https://github.com/dpdpkit-dev/dpdpkit-core@main" \
            "dpdpkit-fastapi @ git+https://github.com/dpdpkit-dev/dpdpkit-fastapi@main" \
            ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check . && ruff format --check .
      - run: cd /tmp && mypy -p dpdpkit.server --disallow-untyped-defs

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t dpdpkit-server:ci .
      - name: Runs as non-root on a read-only file system
        run: |
          docker run -d --name srv --read-only --tmpfs /tmp -p 8000:8000 dpdpkit-server:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/healthz
          test "$(docker exec srv id -u)" = 10001
          docker logs srv

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: docker build -t dpdpkit-server:ci .
      - name: Start the image (test-header authentication, throwaway in-memory database)
        run: |
          docker run -d --name srv --read-only --tmpfs /tmp -p 8000:8000 \
            -v "$PWD/tests/conformance/dpdpkit.yaml:/etc/dpdpkit/dpdpkit.yaml:ro" \
            -e DPDPKIT_DATABASE_URL=sqlite:// -e DPDPKIT_MIGRATE_ON_STARTUP=1 \
            -e DPDPKIT_SIGNING_KEY=ci-only-signing-key -e DPDPKIT_CONFORMANCE=1 dpdpkit-server:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/readyz && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/readyz
      - name: The image serves the admin dashboard
        run: curl -fs http://127.0.0.1:8000/dpdp/admin/ui/ | grep -q 'assets/'
      - name: Conformance suite against the image
        env:
          DPDPKIT_BASE_URL: http://127.0.0.1:8000/dpdp
        run: |
          uv venv
          uv pip install "dpdpkit-conformance @ git+https://github.com/dpdpkit-dev/dpdpkit-spec@main"
          .venv/bin/dpdpkit-conformance -q
      - if: failure()
        run: docker logs srv

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv venv
          uv pip install \
            "dpdpkit-policies @ git+https://github.com/dpdpkit-dev/dpdpkit-policies@main" \
            "dpdpkit-core @ git+https://github.com/dpdpkit-dev/dpdpkit-core@main" \
            "dpdpkit-fastapi @ git+https://github.com/dpdpkit-dev/dpdpkit-fastapi@main" \
            "dpdpkit-conformance[asgi] @ git+https://github.com/dpdpkit-dev/dpdpkit-spec@main" \
            -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: pytest -q
